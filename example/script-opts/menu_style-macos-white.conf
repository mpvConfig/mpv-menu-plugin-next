# mpv-menu-plugin-next · macOS 浅色风格
font_name="PingFang SC"
font_size=29
bold=no
italic=no
row_height=47
separator_height=13
padding_x=12
padding_y=13
root_indent_chars=1
child_indent_chars=1
background=#E7E8E5
border=#E7E8E5
border_width=2
radius=16
text=#222222
disabled_text=#999999
hover_bg=#0A84FF
hover_text=#FFFFFF
hover_border=#00000000
hover_border_width=0
hover_corner_radius=14
shortcut=#5F5F64
hover_shortcut=#FFFFFF
shortcut_gap=7
arrow=#333333
arrow_alpha=0
hover_arrow=#FFFFFF
hover_arrow_alpha=0
arrow_width=32
arrow_font_size=43
separator=#B8B8BC
check=#222222
shadow=#000000
bg_alpha=40
shadow_alpha=60
shadow_blur=30
submenu_gap=7
screen_margin=11
min_width=378
max_width=1080
max_visible_rows=0
click_to_show_submenus=no
hide_root_separators=yes
playlist_header_indent_chars=1
modal_mask=yes
modal_mask_alpha=255
modal_z=1800000
scroll_threshold=0.80
scrollbar_width=9
scrollbar_gap=0
scrollbar_right_gap=2
scrollbar_min_thumb=36
scrollbar_track=#B8B8BC
scrollbar_thumb=#737377
scrollbar_track_alpha=70
scrollbar_thumb_alpha=140
scroll_step=2

# Hover 背景相对菜单外框的左右/上下留白（像素）
hover_margin_x=11
hover_margin_y=0

# 快捷键统一右对齐的右侧间距；有子菜单时表示快捷键与箭头之间的距离
shortcut_right_gap=4
# 播放列表条目右侧格式后缀（MKV/MP4 等）额外左移的距离
playlist_shortcut_right_gap=4

# 快捷键使用真正的右对齐（ASS \an6）：这是“右侧基准”到文字右边缘的距离。
# 有子菜单时，基准是箭头左边；无子菜单时，基准是菜单内容右边。


# UI DPI 自适应缩放（参考 ModernZ/uosc 思路）
# auto: 根据当前 OSD 分辨率自动计算
ui_scale=no
# 设计基准分辨率
design_width=3456
design_height=1944
# 最小/最大缩放范围
min_ui_scale=0.8
max_ui_scale=1.6
# macOS Retina 字体视觉补偿
macos_font_scale=1.4